<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link

            <div id="special-ruta"></div>

            <h2>Meny</h2>

            <h2>Beställning</h2>
            <ul class="list-group mb-2" id="bestallning"></ul>
            <p class="fw-bold" id="summa"></p>

        <script type="module" src="/src/main.ts"></script>
